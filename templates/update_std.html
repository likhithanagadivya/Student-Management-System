```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff, #f3e8ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Decorations */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }

        body::before {
            width: 280px;
            height: 280px;
            background: rgba(59, 130, 246, 0.18);
            top: -80px;
            left: -70px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.15);
            bottom: -120px;
            right: -100px;
        }

        form {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 38px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(30, 64, 175, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 22px;
            border: 1.5px solid #dbe3f0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.3s ease;
        }

        input:hover, select:hover {
            border-color: #93c5fd;
            background: #ffffff;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #94a3b8;
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
            letter-spacing: 0.3px;
        }

        button:hover {
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.35);
        }

        button:active {
            transform: scale(0.97);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back:hover {
            color: #7c3aed;
            transform: translateX(-4px);
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
            }

            form {
                padding: 28px 22px;
            }

            h2 {
                font-size: 25px;
            }

            input, select {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <form action="/students/update/{{ std[0] }}" method="POST">

        <h2>Update Student</h2>

        <p class="subtitle">Update student information below</p>

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               name="name"
               value="{{ std[1] }}"
               placeholder="Enter student name"
               required>

        <label for="age">Age:</label>
        <input type="number"
               id="age"
               name="age"
               value="{{ std[2] }}"
               min="1"
               max="100"
               required>

        <label for="gender">Gender:</label>
        <select name="gender" id="gender" required>
            <option value="">Select Gender</option>

            <option value="Male" {% if std[6] == "Male" %}selected{% endif %}>
                Male
            </option>

            <option value="Female" {% if std[6] == "Female" %}selected{% endif %}>
                Female
            </option>

            <option value="Other" {% if std[6] == "Other" %}selected{% endif %}>
                Other
            </option>
        </select>

        <label for="marks">Marks:</label>
        <input type="number"
               id="marks"
               name="marks"
               value="{{ std[4] }}"
               min="0"
               max="100"
               required>

        <label for="course">Course:</label>
        <input type="text"
               id="course"
               name="course"
               value="{{ std[3] }}"
               placeholder="Enter course name"
               required>

        <label for="image">Image:</label>
        <input type="text"
               id="image"
               name="image"
               value="{{ std[5] }}"
               placeholder="Enter image URL"
               required>

        <label for="status">Attendance:</label>
        <select name="status" id="status" required>

            <option value="1" {% if std[7] == 1 %}selected{% endif %}>
                Present
            </option>

            <option value="0" {% if std[7] == 0 %}selected{% endif %}>
                Absent
            </option>

        </select>

        <button type="submit">Update Student</button>

        <a href="/" class="back">← Back to Home</a>

    </form>

</body>
</html>
