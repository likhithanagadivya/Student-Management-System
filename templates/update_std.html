<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        form {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 28px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #2563eb;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            form {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <form action="/students/update/{{ std[0] }}" method="POST">

        <h2>Update Student</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
        value="{{ std[1] }}" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
        value="{{ std[2] }}" min="1" max="100" required>

        <label for="gender">Gender:</label>
        <select name="gender" id="gender" required>
            <option value="Male" {% if std[6] == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if std[6] == "Female" %}selected{% endif %}>Female</option>
            <option value="Other" {% if std[6] == "Other" %}selected{% endif %}>Other</option>
        </select>

        <label for="marks">Marks:</label>
        <input type="number" id="marks" name="marks"
        value="{{ std[4] }}" min="0" max="100" required>

        <label for="course">Course:</label>
        <input type="text" id="course" name="course"
        value="{{ std[3] }}" required>

        <label for="image">Image URL:</label>
        <input type="text" id="image" name="image"
        value="{{ std[5] }}" required>

        <label for="status">Attendance:</label>

        <select name="status" id="status" required>
            <option value="1" {% if std[7] == 1 %}selected{% endif %}>Present</option>
            <option value="0" {% if std[7] == 0 %}selected{% endif %}>Absent</option>
        </select>

        <button type="submit">Update Student</button>

        <a href="/" class="back">Back to Home</a>

    </form>

</body>
</html>
