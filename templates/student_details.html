
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 200px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 4px solid #dbeafe;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #1e40af;
            font-size: 20px;
            margin: 12px 0;
        }

        .card p {
            color: #475569;
            font-size: 16px;
            margin: 12px 0;
            padding: 10px;
            background: #f8fafc;
            border-radius: 7px;
            text-align: left;
        }

        .present {
            background: #dcfce7 !important;
            color: #15803d !important;
            font-weight: bold;
        }

        .absent {
            background: #fee2e2 !important;
            color: #dc2626 !important;
            font-weight: bold;
        }

        .card a {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .card a:hover {
            background: #1d4ed8;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 25px;
            }

            .card {
                padding: 18px;
            }

            .card img {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <div class="card">

        <img src="{{ std[5] }}" alt="Student Image">

        <h2>Student ID: {{ std[0] }}</h2>

        <h2>Name: {{ std[1] }}</h2>

        <p>Age: {{ std[2] }}</p>

        <p>Course: {{ std[3] }}</p>

        <p>Marks: {{ std[4] }}</p>

        <p>Gender: {{ std[6] }}</p>

        <h3>Attendance:</h3>

        {% if std[7] == 1 %}

            <p class="present">Present</p>

        {% else %}

            <p class="absent">Absent</p>

        {% endif %}

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
