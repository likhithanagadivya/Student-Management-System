```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
            background-size: 300% 300%;
            animation: backgroundMove 10s ease infinite;
            min-height: 100vh;
            padding: 35px 15px;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 36px;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 3px 5px rgba(30, 58, 138, 0.15);
            animation: slideDown 0.8s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            width: 100%;
            max-width: 480px;
            margin: auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 35px rgba(79, 70, 229, 0.18);
            text-align: center;
            transition: all 0.4s ease;
            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(79, 70, 229, 0.25);
        }

        .card img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #c7d2fe;
            padding: 4px;
            background: white;
            margin-bottom: 22px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.18);
            transition: all 0.4s ease;
        }

        .card img:hover {
            transform: scale(1.08) rotate(3deg);
            border-color: #7c3aed;
        }

        .card h2 {
            color: #312e81;
            font-size: 20px;
            margin: 12px 0;
            padding: 12px;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border-radius: 10px;
            border-left: 4px solid #6366f1;
            transition: all 0.3s ease;
        }

        .card h2:hover {
            background: #e0e7ff;
            transform: translateX(5px);
        }

        .card p {
            color: #475569;
            font-size: 15px;
            margin: 12px 0;
            padding: 13px;
            background: #f8fafc;
            border-radius: 9px;
            border-left: 4px solid #818cf8;
            text-align: left;
            transition: all 0.3s ease;
        }

        .card p:hover {
            background: #eef2ff;
            transform: translateX(5px);
        }

        .card h3 {
            color: #312e81;
            font-size: 18px;
            margin-top: 22px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .present {
            background: linear-gradient(135deg, #dcfce7, #bbf7d0) !important;
            color: #15803d !important;
            font-weight: bold;
            border-left: 5px solid #16a34a !important;
            text-align: center !important;
            font-size: 17px !important;
        }

        .absent {
            background: linear-gradient(135deg, #fee2e2, #fecaca) !important;
            color: #dc2626 !important;
            font-weight: bold;
            border-left: 5px solid #dc2626 !important;
            text-align: center !important;
            font-size: 17px !important;
        }

        .card a {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
            transition: all 0.4s ease;
        }

        .card a:hover {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.35);
        }

        .card a:active {
            transform: scale(0.97);
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 25px;
            }

            .card {
                padding: 22px 18px;
            }

            .card img {
                width: 160px;
                height: 160px;
            }

            .card h2 {
                font-size: 17px;
            }

            .card p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <div class="card">

        <img src="{{ std[5] }}" alt="Student Image">

        <h2>Student ID: {{ std[0] }}</h2>

        <h2>Name: {{ std[1] }}</h2>

        <p>Age: {{ std[2] }}</p>

        <p>Course: {{ std[3] }}</p>

        <p>Marks: {{ std[4] }}</p>

        <p>Gender: {{ std[6] }}</p>

        <h3>Attendance:</h3>

        {% if std[7] == 1 %}

            <p class="present">Present</p>

        {% else %}

            <p class="absent">Absent</p>

        {% endif %}

        <a href="/">← Back to Home</a>

    </div>

</body>
</html>
```
