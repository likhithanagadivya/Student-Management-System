
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
            background: linear-gradient(
                -45deg,
                #0f172a,
                #312e81,
                #581c87,
                #1e3a8a
            );
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Background Decorations */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(3px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.22);
            top: -100px;
            left: -80px;
            animation: float 7s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: rgba(6, 182, 212, 0.18);
            bottom: -120px;
            right: -100px;
            animation: float 9s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        /* Main Form */

        form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 510px;
            padding: 38px 40px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            animation: formAppear 0.8s ease;
            transition: 0.4s ease;
        }

        form:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        @keyframes formAppear {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.94);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Heading */

        h2 {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #312e81;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .heading-line {
            width: 75px;
            height: 5px;
            border-radius: 20px;
            margin: 0 auto 25px;
            background: linear-gradient(90deg, #06b6d4, #7c3aed);
        }

        /* Form Groups */

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        /* Inputs and Select */

        input,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #dbe3f0;
            border-radius: 11px;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: all 0.35s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover,
        select:hover {
            border-color: #818cf8;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13);
            transform: translateY(-2px);
        }

        select {
            cursor: pointer;
        }

        /* Two Column Layout */

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
            min-width: 0;
        }

        /* Attendance Select */

        #status {
            font-weight: 600;
            color: #047857;
        }

        /* Submit Button */

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #6366f1, #9333ea);
            background-size: 200% 200%;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.7px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
            transition: all 0.4s ease;
        }

        button:hover {
            background-position: right center;
            transform: translateY(-5px);
            box-shadow: 0 13px 28px rgba(99, 102, 241, 0.45);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Back Link */

        .back {
            display: block;
            text-align: center;
            margin-top: 23px;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back:hover {
            color: #9333ea;
            transform: translateX(-5px);
        }

        /* Responsive Design */

        @media (max-width: 550px) {
            body {
                padding: 20px 12px;
            }

            form {
                padding: 30px 22px;
            }

            h2 {
                font-size: 24px;
            }

            .row {
                gap: 10px;
            }

            input,
            select {
                padding: 12px 10px;
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <form action="/students/add" method="POST">

        <h2>Add Student</h2>

        <p class="subtitle">Enter student details to register a new student</p>

        <div class="heading-line"></div>

        <div class="form-group">
            <label for="name">Student Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required>
        </div>

        <div class="row">

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="100"
                    placeholder="Enter age"
                    required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select name="gender" id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label for="marks">Marks</label>
                <input
                    type="number"
                    id="marks"
                    name="marks"
                    min="0"
                    max="100"
                    placeholder="Enter marks"
                    required>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input
                    type="text"
                    id="course"
                    name="course"
                    placeholder="Enter course"
                    required>
            </div>

        </div>

        <div class="form-group">
            <label for="image">Student Image URL</label>
            <input
                type="text"
                id="image"
                name="image"
                placeholder="Enter image URL"
                required>
        </div>

        <div class="form-group">
            <label for="status">Attendance Status</label>
            <select name="status" id="status" required>
                <option value="1">Present</option>
                <option value="0">Absent</option>
            </select>
        </div>

        <button type="submit">+ Add Student</button>

        <a href="/" class="back">← Back to Home</a>

    </form>

</body>
</html>
