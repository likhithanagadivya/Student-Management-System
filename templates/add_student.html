
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
            background-size: 300% 300%;
            animation: backgroundMove 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        @keyframes backgroundMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        form {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.92);
            padding: 38px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.18);
            animation: formAppear 0.8s ease;
            transition: 0.4s;
        }

        form:hover {
            box-shadow: 0 20px 50px rgba(79, 70, 229, 0.25);
        }

        @keyframes formAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 15px;
        }

        h2::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #2563eb, #9333ea);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        input, select {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 20px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
            color: #334155;
            transition: all 0.3s ease;
        }

        input:hover, select:hover {
            border-color: #818cf8;
            background: #ffffff;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.13);
            background: white;
            transform: translateY(-2px);
        }

        input::placeholder {
            color: #94a3b8;
            font-size: 14px;
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
        }

        button:hover {
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.35);
        }

        button:active {
            transform: scale(0.97);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #4f46e5;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back:hover {
            color: #7c3aed;
            transform: translateX(-4px);
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 12px;
            }

            form {
                padding: 28px 22px;
            }

            h2 {
                font-size: 24px;
            }

            input, select {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <form action="/students/add" method="POST">

        <h2>Add Student</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter student name" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="100" placeholder="Enter age" required>

        <label for="gender">Gender:</label>
        <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="marks">Marks:</label>
        <input type="number" id="marks" name="marks" min="0" max="100" placeholder="Enter marks" required>

        <label for="course">Course:</label>
        <input type="text" id="course" name="course" placeholder="Enter course name" required>

        <label for="image">Image:</label>
        <input type="text" id="image" name="image"
        placeholder="Enter image URL" required>

        <label for="status">Attendance:</label>

        <select name="status" id="status" required>
            <option value="1">Present</option>
            <option value="0">Absent</option>
        </select>

        <button type="submit">Add Student</button>

        <a href="/" class="back">← Back to Home</a>

    </form>

</body>
</html>
